[build]
builder = "nixpacks"

[deploy]
startCommand = "python quick_init.py && python app.py"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production]
variables = { FLASK_ENV = "production", FLASK_DEBUG = "False" }

[environments.development]
variables = { FLASK_ENV = "development", FLASK_DEBUG = "True" }
